aid: micro
name: Micro
description: Micro is an open source project building a Go framework and runtime for
  cloud-native services and AI agents. Its flagship library, go-micro (go-micro.dev/v6),
  provides pluggable abstractions for service discovery, RPC transport, message brokering,
  and configuration, and is described by the project as a Go agent harness and service
  framework. Micro is developed in the open on GitHub under the micro organization.
  The micro.dev site is a minimal landing page rather than a hosted developer portal,
  and the project ships no public REST API, OpenAPI specification, developer console,
  or SaaS control plane at this time.
